name: OpenCV Image CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 AM UTC

#permissions:
#  id-token: write
#  checks: write
#  security-events: write
#  actions: read
#  contents: read
#  packages: write

jobs:
  build-opencv-and-push-to-ghcr:
    name: Build and Push OpenCV To GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag for staging image
        run: echo "IMAGE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Build and push staging image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/hylandsoftware/corretto-sambuca-opencv:${{ env.IMAGE_TAG }}
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            BUILD_DATE=$(date -u "+%Y-%m-%dT%H:%M:%S")
            COMMIT_SHA=${{ github.sha }}
            BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
