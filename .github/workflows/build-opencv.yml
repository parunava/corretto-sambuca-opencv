name: OpenCV Image CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 AM UTC

permissions:
  contents: read
  packages: write

jobs:
  build-opencv-and-push-to-ghcr:
    name: Build and Push OpenCV To GHCR
    runs-on: ubuntu-latest
    # strategy:
    #   fail-fast: false
    #   matrix:
#        platform:
#          - linux/amd64
#          - linux/arm64/v8
        # include:
        #   - os: ubuntu-latest
        #     arch: amd64
        #     platform: linux/amd64
        #   - os: ubuntu-22.04-arm
        #     arch: arm64
        #     platform: linux/arm64/v8

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

#      - name: Set up QEMU
#        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag for staging image
        run: echo "IMAGE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Download binaries
        run: curl -L \
             -H "Accept: application/octet-stream" \
             -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             -o ${{ runner.temp }}/opencv-binaries.zip \
             https://api.github.com/repos/HylandSoftware/corretto-grappa/releases/assets/262544797

      - name: Download binaries
        run: ls -l ${{ runner.temp }}

